<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>{% block title %}AI Catalogs{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/logo_256.png">
<link rel="stylesheet" href="{{ prefix }}/static/admin.css">
{% if logged_in %}<script src="{{ prefix }}/static/admin.js" defer></script>{% endif %}
</head>
<body>
<header class="top">
  <a class="brand" href="{{ prefix }}/"><img src="/static/logo_256.png" alt="">AI Catalogs</a>
  <div class="row-start">
    <a class="gh" href="https://github.com/RenewedKeys/ai-catalogs" target="_blank" rel="noopener noreferrer" aria-label="AI Catalogs on GitHub" title="AI Catalogs on GitHub">
      <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub</span>
    </a>
    <a class="version" href="https://github.com/RenewedKeys/ai-catalogs/releases" target="_blank" rel="noopener noreferrer" title="Release notes">v{{ version }}</a>
    {% if logged_in and not proxy_auth %}
    <form method="post" action="{{ prefix }}/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="ghost">Log out</button>
    </form>
    {% endif %}
  </div>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
