{% extends "base.html" %}
{% block title %}Sign in · AI Catalogs{% endblock %}
{% block content %}
<div class="login">
  <div class="card hero">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your catalogs.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ prefix }}/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
