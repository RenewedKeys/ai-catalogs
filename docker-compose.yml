# Two services from one locally built image:
#   web     serves HTTP (catalog routes; legacy UI only when ENABLE_LEGACY=true)
#   worker  runs the scheduler: schedules, catch-up, recovery, nightly backups (PLAN.md section 11)
#
# Secrets come from a .env file next to this file (see .env.example). Never commit it.

x-app: &app
  build: .
  image: ${IMAGE:-ai-catalogs:local}
  restart: unless-stopped
  stop_grace_period: 30s
  env_file:
    - path: ${ENV_FILE:-.env}
      required: false
  volumes:
    - data:/data
    - ./catalogs.d:/app/catalogs.d:ro

services:
  web:
    <<: *app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - UVICORN_WORKERS=${UVICORN_WORKERS:-0}

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      # Healthy while this container's worker holds the lease; its heartbeat renews it every
      # 20 s (TTL 90 s), also during a run. start_period covers waiting out a previous lease.
      test: ["CMD", "python", "-m", "app.curation", "status", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # Redis is only used by the legacy routes (ENABLE_LEGACY=true). To use it, uncomment this
  # service and set REDIS_HOST=redis in .env. Do not publish its port.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped

volumes:
  # Must be a local filesystem (not NFS/SMB): it will hold the SQLite database.
  data:
